<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf7f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="回憶地圖">
<title>回憶地圖</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="map"></div>

<header id="topbar">
  <div class="chips" id="chips"></div>
  <div class="chips sub" id="subchips" hidden></div>
  <div id="info" hidden></div>
</header>

<div class="side">
  <button class="round" id="btn-locate" aria-label="我的位置">
    <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <button class="round" id="btn-menu" aria-label="設定">
    <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg>
  </button>
</div>

<button id="fab">＋ 新增地點</button>

<div id="crosshair" aria-hidden="true">
  <svg viewBox="0 0 32 44" width="32" height="44"><path d="M16 1C7.7 1 1 7.6 1 15.8 1 27 16 43 16 43s15-16 15-27.2C31 7.6 24.3 1 16 1z" fill="#e4572e" stroke="#fff" stroke-width="2"/><circle cx="16" cy="16" r="5.5" fill="#fff"/></svg>
</div>

<div id="backdrop"></div>
<section id="sheet" aria-live="polite"></section>

<div id="lightbox" hidden><img alt=""></div>
<div id="confirm" hidden>
  <div class="box">
    <p id="confirm-msg"></p>
    <div class="actions">
      <button id="confirm-no">取消</button>
      <button id="confirm-yes" class="danger">刪除</button>
    </div>
  </div>
</div>
<div id="toast" hidden></div>

<div id="login" hidden>
  <form id="login-form">
    <div class="login-mark">📍</div>
    <h1 id="login-title">回憶地圖</h1>
    <input type="email" name="email" placeholder="Email" autocomplete="email" required>
    <input type="password" name="password" placeholder="密碼" autocomplete="current-password" required>
    <button class="primary" type="submit">登入</button>
    <div class="login-err" id="login-err"></div>
  </form>
</div>

<script src="config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/lite.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
